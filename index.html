    <script>
      ;(() => {
        let theme = null

        try {
          theme = window.localStorage.getItem('theme')
        } catch {
          theme = null
        }

        if (theme !== 'light' && theme !== 'dark') {
          try {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          } catch {
            theme = 'light'
          }
        }

        document.documentElement.classList.toggle('dark', theme === 'dark')
      })()
    </script>
