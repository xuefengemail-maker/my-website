name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_STUDYPAL_API_BASE_URL: ${{ vars.VITE_STUDYPAL_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate production API URL
        run: |
          if [ -z "$VITE_STUDYPAL_API_BASE_URL" ]; then
            echo "::error::VITE_STUDYPAL_API_BASE_URL is not configured. Add it as a repository variable."
            exit 1
          fi
          case "$VITE_STUDYPAL_API_BASE_URL" in
            https://*) ;;
            *)
              echo "::error::VITE_STUDYPAL_API_BASE_URL must start with https://."
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
