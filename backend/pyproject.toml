[project]
name = "studypal-backend"
version = "0.1.0"
description = "StudyPal authentication and profile API"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.4,<3",
    "pwdlib[argon2]>=0.2,<1",
    "PyJWT>=2.9,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
